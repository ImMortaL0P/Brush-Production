<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Brush</title>
  <link rel="icon" href="Brush%20Text%20Arial.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/84df58c29a.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #121212;
      --bg-card: #1a1a1a;
      --accent: #dcff80;
      --accent-hover: #bce650;
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --border-color: #27272a;
      --success: #4ade80;
      --sale-red: #ff4d4d;
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 250px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-primary);
      text-decoration: none;
      margin-bottom: 3rem;
    }
    .brand span { color: var(--accent); }
    .brand img { height: 32px; width: auto; }
    
    .nav-item {
      padding: 0.8rem 1rem;
      border-radius: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 0.5rem;
      transition: all 0.2s;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(220, 255, 128, 0.1);
      color: var(--accent);
    }
    
    .main-content {
      flex: 1;
      padding: 2rem 3rem;
      overflow-y: auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
    }
    
    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
    }
    
    /* Tables */
    .data-table-wrapper {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }
    th {
      font-weight: 600;
      color: var(--text-secondary);
      background: rgba(255,255,255,0.02);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    tr:last-child td {
      border-bottom: none;
    }
    
    .status-badge {
      padding: 4px 10px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: capitalize;
    }
    .status-confirmed { background: rgba(220, 255, 128, 0.1); color: var(--accent); }
    .status-packed { background: rgba(59, 130, 246, 0.1); color: #60a5fa; }
    .status-shipped { background: rgba(168, 85, 247, 0.1); color: #c084fc; }
    .status-delivered { background: rgba(74, 222, 128, 0.1); color: var(--success); }
    .status-cancelled { background: rgba(239, 68, 68, 0.1); color: #f87171; }
    
    select.status-dropdown {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .action-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-block;
    }
    .action-btn:hover {
      background: var(--accent);
      color: var(--bg-primary);
    }
    
    .prod-thumb {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      vertical-align: middle;
      margin-right: 10px;
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-left: 4px solid var(--accent);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10000;
    }
    .toast.visible {
      transform: translateY(0);
      opacity: 1;
    }
    .toast i { color: var(--accent); }
    
    .refresh-btn {
      background: var(--accent);
      color: var(--bg-primary);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .refresh-btn:hover {
      background: var(--accent-hover);
    }
    
    /* Login Overlay */
    .login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }
    .login-box {
      background: var(--bg-secondary);
      padding: 3rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .login-box h2 {
      margin-top: 0;
      font-family: 'Outfit', sans-serif;
      margin-bottom: 2rem;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 8px;
      font-family: inherit;
      box-sizing: border-box;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: var(--bg-primary);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .login-box button:hover {
      background: var(--accent-hover);
    }
    .login-error {
      color: var(--sale-red);
      margin-top: 1rem;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Login Overlay -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-box">
      <h2>Admin Login</h2>
      <form id="login-form">
        <input type="text" id="admin-user" placeholder="Username" required>
        <input type="password" id="admin-pass" placeholder="Password" required>
        <button type="submit">Log In</button>
        <div class="login-error" id="login-error">Invalid credentials</div>
      </form>
    </div>
  </div>

  <div class="sidebar">
    <a href="index.html" class="brand">
      <img src="Brush%20Text%20Arial.png" alt="Brush Logo" style="height: 32px; width: auto;">
    </a>
    
    <div class="nav-item active" data-target="orders-view">
      <i class="fa-solid fa-box-open"></i> Orders
    </div>
    <div class="nav-item" data-target="inventory-view">
      <i class="fa-solid fa-warehouse"></i> Inventory
    </div>
    <div class="nav-item" data-target="add-product-view">
      <i class="fa-solid fa-plus-circle"></i> Add Product
    </div>
    
    <div style="margin-top: auto;">
      <a href="index.html" class="nav-item">
        <i class="fa-solid fa-store"></i> Back to Store
      </a>
    </div>
  </div>

  <div class="main-content">
    
    <!-- Orders View -->
    <div class="view-section active" id="orders-view">
      <div class="header">
        <h1>Orders Management</h1>
        <button class="refresh-btn" onclick="loadOrders()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
      </div>
      
      <div class="data-table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Date</th>
              <th>Customer</th>
              <th>Total</th>
              <th>Payment</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="orders-table-body">
            <tr><td colspan="7" style="text-align: center;">Loading orders...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    
    <!-- Inventory View -->
    <div class="view-section" id="inventory-view">
      <div class="header">
        <h1>Inventory & Products</h1>
        <button class="refresh-btn" onclick="loadInventory()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
      </div>
      

      
      <div class="data-table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Product Details</th>
              <th>SKU (ID)</th>
              <th>Badge</th>
              <th>Base Price</th>
              <th>Stock Qty</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inventory-table-body">
            <tr><td colspan="6" style="text-align: center;">Loading inventory...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    
    <!-- Add Product View -->
    <div class="view-section" id="add-product-view">
      <div class="header">
        <h1>Add New Product</h1>
      </div>
      <div style="background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color);">
        <form id="add-product-form" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <input type="text" id="new-prod-name" placeholder="Product Name *" required style="background: var(--bg-secondary); color: white; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px;">
          <input type="text" id="new-prod-cat" placeholder="Category (e.g. Anime) *" required style="background: var(--bg-secondary); color: white; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px;">
          <input type="number" id="new-prod-price" placeholder="Price (₹) *" required style="background: var(--bg-secondary); color: white; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px;">
          <input type="number" id="new-prod-original-price" placeholder="Original Price (₹)" style="background: var(--bg-secondary); color: white; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px;">
          <input type="text" id="new-prod-badge" placeholder="Badge (e.g. New, Sale)" style="background: var(--bg-secondary); color: white; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px;">
          <input type="number" id="new-prod-stock" placeholder="Stock Quantity *" required style="background: var(--bg-secondary); color: white; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px;">
          <input type="text" id="new-prod-desc" placeholder="Short Description" style="grid-column: 1 / -1; background: var(--bg-secondary); color: white; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px;">
          <div style="grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;">
            <label style="color: var(--text-secondary); font-size: 0.9rem;">Upload Poster (PNG/JPG/PDF):</label>
            <input type="file" id="new-prod-image" accept="image/png, image/jpeg, application/pdf" required style="color: white;">
          </div>
          <button type="submit" class="refresh-btn" style="grid-column: 1 / -1; justify-content: center; margin-top: 10px;" id="add-prod-btn">
            <i class="fa-solid fa-plus"></i> Add Product
          </button>
        </form>
      </div>
    </div>

  </div>
  
  <div class="toast" id="toast">
    <i class="fa-solid fa-check-circle"></i>
    <span class="toast-text" id="toast-text">Success!</span>
  </div>

  <script>
    const API_BASE = 'http://localhost:5500/api';
    
    // Auth State
    let adminToken = sessionStorage.getItem('brush_admin_token');
    
    function checkAuth() {
      if (adminToken) {
        document.getElementById('login-overlay').style.display = 'none';
        loadOrders();
      } else {
        document.getElementById('login-overlay').style.display = 'flex';
      }
    }
    
    function logout() {
      sessionStorage.removeItem('brush_admin_token');
      adminToken = null;
      checkAuth();
    }
    
    // Handle Unauthorized APIs
    function handleApiError(res) {
      if (res.status === 401) {
        logout();
        throw new Error('Session expired. Please log in again.');
      }
    }
    
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('admin-user').value;
      const pass = document.getElementById('admin-pass').value;
      const errorMsg = document.getElementById('login-error');
      
      try {
        const res = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();
        
        if (res.ok && data.token) {
          adminToken = data.token;
          sessionStorage.setItem('brush_admin_token', adminToken);
          errorMsg.style.display = 'none';
          document.getElementById('login-form').reset();
          checkAuth();
        } else {
          errorMsg.style.display = 'block';
          errorMsg.textContent = data.error || 'Invalid credentials';
        }
      } catch (err) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Server error. Please try again.';
      }
    });

    // Toast
    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = message;
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 3000);
    }
    
    // Tab switching
    document.querySelectorAll('.nav-item[data-target]').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
        
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.getElementById(item.dataset.target).classList.add('active');
        
        if(item.dataset.target === 'orders-view') loadOrders();
        if(item.dataset.target === 'inventory-view') loadInventory();
      });
    });

    // Load Orders
    async function loadOrders() {
      if (!adminToken) return;
      const tbody = document.getElementById('orders-table-body');
      try {
        const res = await fetch(`${API_BASE}/orders`, {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        handleApiError(res);
        const orders = await res.json();
        
        if(orders.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No orders found.</td></tr>';
          return;
        }
        
        tbody.innerHTML = orders.map(o => {
          const date = new Date(o.createdAt).toLocaleDateString();
          return `
            <tr>
              <td><strong>${o.orderId}</strong></td>
              <td>${date}</td>
              <td>
                ${o.customer.name}<br>
                <small style="color:var(--text-secondary)">${o.customer.city}</small>
              </td>
              <td>₹${o.total.toFixed(2)}</td>
              <td style="text-transform:uppercase; font-size:0.85rem; font-weight:600;">${o.paymentMethod}</td>
              <td>
                <select class="status-dropdown" onchange="updateOrderStatus('${o.orderId}', this.value)">
                  <option value="confirmed" ${o.status==='confirmed'?'selected':''}>Confirmed</option>
                  <option value="packed" ${o.status==='packed'?'selected':''}>Packed</option>
                  <option value="shipped" ${o.status==='shipped'?'selected':''}>Shipped</option>
                  <option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option>
                  <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option>
                </select>
                <span class="status-badge status-${o.status}" style="margin-left: 10px;">${o.status}</span>
              </td>
              <td>
                <a href="${API_BASE}/orders/${o.orderId}/invoice" target="_blank" class="action-btn">
                  <i class="fa-solid fa-file-pdf"></i> Invoice
                </a>
              </td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--sale-red);">Failed to load orders.</td></tr>';
      }
    }
    
    // Update Order Status
    async function updateOrderStatus(orderId, newStatus) {
      if (!adminToken) return;
      try {
        const res = await fetch(`${API_BASE}/orders/${orderId}/status`, {
          method: 'PATCH',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${adminToken}`
          },
          body: JSON.stringify({ status: newStatus })
        });
        handleApiError(res);
        if(!res.ok) throw new Error('Failed to update');
        showToast(`Order ${orderId} marked as ${newStatus}`);
        loadOrders();
      } catch (e) {
        showToast(e.message);
      }
    }

    // Load Inventory
    async function loadInventory() {
      if (!adminToken) return;
      const tbody = document.getElementById('inventory-table-body');
      try {
        const res = await fetch(`${API_BASE}/products`);
        const products = await res.json();
        
        tbody.innerHTML = products.map(p => `
          <tr>
            <td>
              <div style="display:flex; align-items:center; gap:10px;">
                <img src="${p.image}" class="prod-thumb">
                <div>
                  <input type="text" id="name-${p.id}" value="${p.name}" style="width: 200px; background:var(--bg-card); color:white; border:1px solid var(--border-color); padding:4px; border-radius:4px; font-weight:600; font-family:inherit;"><br>
                  <small style="color:var(--text-secondary)">${p.category}</small>
                </div>
              </div>
            </td>
            <td style="font-family:monospace; color:var(--text-secondary);">${p.sku || p.id}</td>
            <td>
              <input type="text" id="badge-${p.id}" value="${p.badge || ''}" style="width: 70px; background:var(--bg-card); color:white; border:1px solid var(--border-color); padding:4px; border-radius:4px;">
            </td>
            <td>
              ₹<input type="number" id="price-${p.id}" value="${p.price}" style="width: 60px; background:var(--bg-card); color:white; border:1px solid var(--border-color); padding:4px; border-radius:4px;">
            </td>
            <td>
              <input type="number" id="stock-${p.id}" value="${p.stockQuantity !== undefined ? p.stockQuantity : 0}" style="width: 60px; background:var(--bg-card); color:white; border:1px solid var(--border-color); padding:4px; border-radius:4px;">
            </td>
            <td>
              <button class="action-btn" onclick="updateProduct(${p.id})">Save</button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--sale-red);">Failed to load inventory.</td></tr>';
      }
    }
    
    // Update Product
    async function updateProduct(id) {
      if (!adminToken) return;
      const name = document.getElementById(`name-${id}`).value;
      const price = parseInt(document.getElementById(`price-${id}`).value);
      const stockQuantity = parseInt(document.getElementById(`stock-${id}`).value);
      const badge = document.getElementById(`badge-${id}`).value;
      
      try {
        const res = await fetch(`${API_BASE}/products/${id}`, {
          method: 'PATCH',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${adminToken}`
          },
          body: JSON.stringify({ name, price, badge, stockQuantity })
        });
        handleApiError(res);
        if(!res.ok) throw new Error('Failed to update product');
        showToast('Product updated successfully!');
      } catch (e) {
        showToast(e.message);
      }
    }

    // Add New Product
    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!adminToken) return;
      
      const btn = document.getElementById('add-prod-btn');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Adding...';
      btn.disabled = true;
      
      let finalImageFile = document.getElementById('new-prod-image').files[0];
      
      // If PDF, convert first page to JPEG
      if (finalImageFile && finalImageFile.type === 'application/pdf') {
        try {
          btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Parsing PDF...';
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
          
          const arrayBuffer = await finalImageFile.arrayBuffer();
          const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
          const page = await pdf.getPage(1);
          
          const viewport = page.getViewport({ scale: 2.0 }); // High quality scale
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          
          await page.render({ canvasContext: context, viewport: viewport }).promise;
          
          // Convert to blob
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
          finalImageFile = new File([blob], finalImageFile.name.replace('.pdf', '.jpg'), { type: 'image/jpeg' });
        } catch (err) {
          console.error("PDF Parsing Error:", err);
          showToast('Failed to parse PDF. Please upload a valid file.');
          btn.innerHTML = '<i class="fa-solid fa-plus"></i> Add Product';
          btn.disabled = false;
          return;
        }
      }
      
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Adding...';
      
      const formData = new FormData();
      formData.append('name', document.getElementById('new-prod-name').value);
      formData.append('category', document.getElementById('new-prod-cat').value);
      formData.append('price', document.getElementById('new-prod-price').value);
      formData.append('originalPrice', document.getElementById('new-prod-original-price').value || document.getElementById('new-prod-price').value);
      formData.append('badge', document.getElementById('new-prod-badge').value);
      formData.append('stockQuantity', document.getElementById('new-prod-stock').value);
      formData.append('description', document.getElementById('new-prod-desc').value);
      formData.append('image', finalImageFile);
      
      try {
        const res = await fetch(`${API_BASE}/products`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${adminToken}` },
          body: formData
        });
        
        handleApiError(res);
        if(!res.ok) throw new Error('Failed to add product');
        
        showToast('New product added to inventory!');
        document.getElementById('add-product-form').reset();
        loadInventory();
      } catch (err) {
        showToast(err.message);
      } finally {
        btn.innerHTML = '<i class="fa-solid fa-plus"></i> Add Product';
        btn.disabled = false;
      }
    });

    // Init
    checkAuth();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <script src="api-base.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="theme.js?v=2"></script>
  <title>Page Not Found — Brush</title>
  <meta name="description" content="The page you're looking for couldn't be found. Browse Brush's premium posters, stickers and wall art.">
  <link rel="icon" href="assets/misc/favicon.png" type="image/png">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://ka-f.fontawesome.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
  <script src="https://kit.fontawesome.com/84df58c29a.js" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="styles.css?v=23">
  <style>
    .not-found-main {
      min-height: calc(100dvh - 70px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 24px;
    }

    .not-found-code {
      font-family: var(--font-heading);
      font-size: clamp(4rem, 14vw, 8rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      color: transparent;
      -webkit-text-stroke: 2px var(--text-muted);
      text-stroke: 2px var(--text-muted);
    }

    .not-found-title {
      font-family: var(--font-heading);
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 700;
      margin: 12px 0 10px;
    }

    .not-found-text {
      color: var(--text-secondary);
      max-width: 440px;
      margin: 0 0 32px;
      text-wrap: pretty;
    }

    .not-found-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
  <script src="global-navbar.js?v=6"></script>
  <script src="global-footer.js?v=2" defer></script>
</head>
<body>

  <global-navbar></global-navbar>

  <main id="main-content" class="not-found-main">
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">This page took a wrong turn</h1>
    <p class="not-found-text">The page you're looking for doesn't exist, moved, or the link's just plain broken. Let's get you back on track.</p>
    <div class="not-found-actions">
      <a href="index.html" class="hero-cta">Back to Home →</a>
      <a href="all_products.html" class="btn-ghost">Shop All Products</a>
    </div>
  </main>

  <global-footer></global-footer>

  <script src="navbar-scroll.js?v=3"></script>
  <script src="micro-interactions.js"></script>
</body>
</html>

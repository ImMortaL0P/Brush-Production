<!DOCTYPE html>
<html lang="en">
<head>
  <script src="api-base.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="theme.js?v=2"></script>
  <title>Shop — Brush</title>
  <meta name="description" content="Shop every Brush product — posters, T-shirts, stickers, wallpapers and collectibles — with filters by type and genre.">
  <link rel="icon" href="assets/misc/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://ka-f.fontawesome.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
  <script src="https://kit.fontawesome.com/84df58c29a.js" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="styles.css?v=28">
  <link rel="stylesheet" href="store.css?v=2">
  <script src="global-navbar.js?v=9"></script>
  <script src="site-overlays.js?v=2"></script>
  <script src="global-footer.js?v=4" defer></script>
</head>
<body class="page-layered store-page">

  <div class="scroll-progress" id="scroll-progress"></div>

  <global-navbar></global-navbar>

  <main id="main-content" class="store">
    <div class="store-top">
      <nav class="store-breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><i class="fa-solid fa-chevron-right" aria-hidden="true"></i><a href="all_products.html">Shop</a><i class="fa-solid fa-chevron-right" aria-hidden="true"></i><span id="store-crumb" aria-current="page">All Products</span>
      </nav>
      <div class="store-tabs" id="store-tabs" role="tablist" aria-label="Product categories">
        <!-- Rendered by store.js -->
      </div>
    </div>

    <div class="store-layout">
      <aside class="store-facets-panel" id="store-facets-panel" aria-label="Filters" data-lenis-prevent>
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="store-facets" id="store-facets">
          <div class="facet-head"><h2>Filters</h2></div>
          <div class="facet-skeleton skeleton-block"></div>
          <div class="facet-skeleton skeleton-block"></div>
          <div class="facet-skeleton skeleton-block"></div>
        </div>
        <div class="sheet-footer">
          <button type="button" class="btn-ghost" data-action="clear">Clear</button>
          <button type="button" class="hero-cta" data-close-sheet>Show <span id="store-sheet-count">results</span></button>
        </div>
      </aside>

      <section class="store-results" id="store-results" aria-labelledby="store-title">
        <header class="store-results-head">
          <div>
            <h1 id="store-title">All Products</h1>
            <p class="store-count" id="store-count" aria-live="polite">Loading products…</p>
          </div>
          <p class="store-intro" id="store-intro"></p>
        </header>

        <div class="reels-promo" id="store-reels-promo" hidden>
          <div class="reels-promo-icon" aria-hidden="true"><i class="fa-solid fa-film"></i></div>
          <div class="reels-promo-text">
            <strong>Browse Posters</strong>
            <span>Swipe through posters one at a time, full screen — double-tap to add to cart.</span>
          </div>
          <a href="poster-reels.html" class="hero-cta">Start browsing →</a>
        </div>

        <div class="sort-bar" id="store-sort-bar" role="group" aria-label="Sort products"></div>
        <div class="filter-chips" id="store-chips" hidden></div>

        <div class="store-grid" id="store-grid" aria-busy="false">
          <div class="store-card-skeleton"><div class="skeleton-block"></div><span class="skeleton-block"></span><span class="skeleton-block"></span></div>
          <div class="store-card-skeleton"><div class="skeleton-block"></div><span class="skeleton-block"></span><span class="skeleton-block"></span></div>
          <div class="store-card-skeleton"><div class="skeleton-block"></div><span class="skeleton-block"></span><span class="skeleton-block"></span></div>
          <div class="store-card-skeleton"><div class="skeleton-block"></div><span class="skeleton-block"></span><span class="skeleton-block"></span></div>
          <div class="store-card-skeleton"><div class="skeleton-block"></div><span class="skeleton-block"></span><span class="skeleton-block"></span></div>
          <div class="store-card-skeleton"><div class="skeleton-block"></div><span class="skeleton-block"></span><span class="skeleton-block"></span></div>
          <div class="store-card-skeleton"><div class="skeleton-block"></div><span class="skeleton-block"></span><span class="skeleton-block"></span></div>
          <div class="store-card-skeleton"><div class="skeleton-block"></div><span class="skeleton-block"></span><span class="skeleton-block"></span></div>
        </div>

        <nav class="store-pagination" id="store-pagination" aria-label="Product pages"></nav>

        <section class="catalog-faq">
          <h2 class="catalog-faq-title">Before you order</h2>
          <div class="faq-accordion-col" id="store-faq"></div>
        </section>
      </section>
    </div>

    <!-- Phone-only: bottom action bar + sort sheet (the filter sheet is the
         sidebar above, restyled as a sheet under 900px). -->
    <div class="store-mobile-bar" role="group" aria-label="Sort and filter">
      <button type="button" id="open-sort"><i class="fa-solid fa-arrow-down-wide-short" aria-hidden="true"></i><span><strong>Sort</strong><small id="store-sort-current">Relevance</small></span></button>
      <button type="button" id="open-filters"><i class="fa-solid fa-sliders" aria-hidden="true"></i><span><strong>Filter</strong><small>Genre, price…</small></span><span class="filter-badge" id="store-filter-badge" hidden>0</span></button>
    </div>
    <div class="store-sort-sheet" id="store-sort-sheet" role="dialog" aria-modal="true" aria-label="Sort by" data-lenis-prevent>
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2>Sort by</h2>
      <div class="facet-list" id="store-sort-sheet-list"></div>
    </div>
    <div class="sheet-backdrop" id="store-sheet-backdrop"></div>

  </main>

  <global-footer></global-footer>

  <site-overlays></site-overlays>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.25/dist/lenis.min.js"></script>
  <script src="scroll.js?v=2"></script>
  <script src="navbar-scroll.js?v=4"></script>
  <script src="micro-interactions.js"></script>
  <script src="img-utils.js?v=2"></script>
  <script src="cart.js?v=4"></script>
  <script src="script.js?v=26"></script>
  <script src="store.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
.carousel-slides-container {
  width: 400px;
  height: 400px;
  position: relative;
  background: #eee;
  overflow: visible; /* we'll see if it works */
}
.carousel-slide {
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: absolute;
  inset: 0;
  display: flex;
}
.zoom-magnifier {
  position: absolute; border-radius: 8px; width: 280px; height: 280px; 
  border: 4px solid red; 
  background-repeat: no-repeat; pointer-events: none; opacity: 1; z-index: 999;
}
</style>
</head>
<body>
<div class="carousel-slides-container" id="container">
  <div class="zoom-magnifier" id="magnifier"></div>
  <div class="carousel-slide" id="sl">
    <img src="https://picsum.photos/800/1200" id="img" style="max-height: 100%; max-width: 100%; width: auto; height: auto; object-fit: contain; cursor: crosshair; transform: scale(1.65);">
  </div>
</div>

<script>
const img = document.getElementById('img');
const magnifier = document.getElementById('magnifier');
const sl = document.getElementById('sl');

img.addEventListener('mousemove', (e) => {
  const rect = img.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  magnifier.style.backgroundImage = `url('${img.src}')`;

  const zoomLevel = 2.5;
  magnifier.style.backgroundSize = `${rect.width * zoomLevel}px auto`;

  const containerRect = sl.parentElement.getBoundingClientRect();
  const lensX = e.clientX - containerRect.left - 140;
  const lensY = e.clientY - containerRect.top - 140;

  magnifier.style.left = lensX + 'px';
  magnifier.style.top = lensY + 'px';

  const bgX = -((x * zoomLevel) - 140);
  const bgY = -((y * zoomLevel) - 140);
  magnifier.style.backgroundPosition = `${bgX}px ${bgY}px`;
});
</script>
</body>
</html>
